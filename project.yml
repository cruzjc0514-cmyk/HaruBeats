name: HaruBeats
options:
  bundleIdPrefix: com.harubeats
  deploymentTarget:
    iOS: "17.0"
targets:
  HaruBeats:
    type: application
    platform: iOS
    sources:
      - path: HaruBeats
    info:
      path: HaruBeats/Info.plist
      properties:
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "HaruBeats necesita acceso a tu red local para recibir música desde tu computadora por Wi-Fi."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: com.harubeats.app
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES